name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # reproduce retained app graphs for already-open tabs
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: public close export preserves last-good data
        run: python3 -m unittest discover -s tests -p 'test_export_desk_prices.py'
      - name: archived homepage proof and source validation
        run: |
          python3 -m unittest discover -s tests -p 'test_home_proof.py'
          python3 -m unittest discover -s tests -p 'test_home_creator_source.py'
      - name: app module release isolation
        run: python3 -m unittest discover -s tests -p 'test_build_assets.py'
      - name: research preview release and rollback switch
        run: python3 -m unittest discover -s tests -p 'test_research_brief_config.py'
      - name: build (zh + en, i18n key parity)
        run: python3 build.py
      - run: npm test
      - name: lint copy (banned strings, data-winrate ⇔ data-n, disclaimer lines, no third-party scripts)
        run: python3 scripts/lint_copy.py
      - name: internal link check
        run: python3 scripts/check_links.py
      - name: sanity — both landings exist
        run: test -s dist/index.html && test -s dist/en/index.html && test -s dist/_headers
