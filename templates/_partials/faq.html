<section class="section faq" id="faq">
  <div class="wrap narrow">
    <h2>{{ t('faq.h2') }}</h2>
    <div class="faq-list">
      {% for i in range(1, 7) %}
      <details class="faq-item">
        <summary>{{ t('faq.q' ~ i) }}</summary>
        <p>{{ t('faq.a' ~ i) }}</p>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
