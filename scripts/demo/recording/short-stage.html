<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ducky · short film composition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#090d0a;color:#f1f4f2;font-family:Arial,"PingFang SC","Heiti SC",sans-serif}main{width:1440px;height:810px;overflow:hidden;padding:24px 56px;position:relative}header{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700}header img{width:48px;height:48px;border-radius:50%}header span:last-child{margin-left:auto;color:#9ca59f;font-size:16px;font-weight:400}h1{font-size:36px;line-height:1.22;margin:20px 0 10px;letter-spacing:-.6px}p{color:#abb5ae;font-size:20px;line-height:1.45;margin:0}section{height:570px;display:flex;justify-content:center;align-items:center;gap:46px}section img{max-height:548px;max-width:1120px;object-fit:contain;border-radius:12px}section.pair{height:570px;gap:44px}section.pair img{max-width:570px;max-height:536px}figure{margin:0;text-align:center}figcaption{color:#f2ad40;font-size:18px;line-height:1.3;margin:0 0 12px}.arrow{font-size:32px;color:#f2ad40}footer{position:absolute;left:56px;right:56px;bottom:20px;color:#9ca59f;font-size:17px;border-top:1px solid #29342c;padding-top:14px}.end{height:610px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;text-align:center}.end img{width:132px;height:132px;border-radius:50%}.end h1{font-size:56px;margin:10px 0}.end strong{font-size:32px;color:#f2ad40}.end p{font-size:24px}
</style></head><body><main><header><img src="/avatar-160.jpg" alt="Ducky"><span>Ducky TradeBot</span><span id="capture-date"></span></header><div id="content"></div><footer id="foot"></footer></main>
<script>
const q=new URLSearchParams(location.search),lang=q.get('lang')==='en'?'en':'zh',mode=q.get('scene')||'alerts';
document.documentElement.lang=lang;
const en=lang==='en',root=document.getElementById('content'),prefix='/frames-v5/'+lang+'/';
document.getElementById('capture-date').textContent=en?'Recorded · 2026-09-06':'产品演示 · 2026-09-06';
const shot=(file,caption)=>`<figure><figcaption>${caption}</figcaption><img src="${prefix+file}" alt="${caption}"></figure>`;
if(mode==='filing'){
 root.innerHTML=`<h1>COE · 2026-06-30</h1><p>${en?'Check the transaction, filing date and original source.':'核对买入性质、披露日期与原始来源。'}</p><section>${shot('02-filing.png',en?'Original filing details':'原始申报详情')}</section>`;
 document.getElementById('foot').textContent=en?'Separate historical filing example · not a match to the preceding combined filter':'独立历史申报示例 · 不表示命中前面的组合筛选条件';
}else if(mode==='end'){
 root.innerHTML=`<div class="end"><img src="/avatar-160.jpg" alt="Ducky"><h1>${en?'Start free with one stock.':'先免费关注一只股票。'}</h1><strong>duckybot.app</strong><p>${en?'Company events · creator views · your alerts':'公司事件 · 博主观点 · 你设置的提醒'}</p></div>`;
 document.getElementById('foot').textContent=en?'Research and alerts · English and Chinese · browser access':'研究与提醒 · 支持中英文 · 网页直接使用';
}else{
 root.innerHTML=`<h1>${en?'Follow a topic. Check why the content matches.':'关注一个主题，也能核对为什么收到这条内容。'}</h1><section class="pair">${shot('05-inbox-card.png',en?'Related content in your inbox':'相关内容进入收件箱')}<span class="arrow">→</span>${shot('05-reason.png',en?'Check the original words at 1:11':'点开 1:11，核对原话')}</section>`;
 document.getElementById('foot').textContent=en?'Historical content demonstration · semiconductor topic match · original source dates retained':'历史内容演示 · 按半导体主题匹配 · 保留原始来源日期';
}
</script><nav style="position:absolute;top:830px;left:56px;display:flex;gap:24px;font-size:16px">
<a href="?lang=zh&amp;scene=alerts">ZH alerts</a><a href="?lang=en&amp;scene=alerts">EN alerts</a>
<a href="?lang=zh&amp;scene=filing">ZH filing</a><a href="?lang=en&amp;scene=filing">EN filing</a>
<a href="?lang=zh&amp;scene=end">ZH end</a><a href="?lang=en&amp;scene=end">EN end</a>
</nav></body></html>
