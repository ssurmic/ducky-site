<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ducky · story edit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0c0c;color:#f1f3f2;font-family:Arial,"PingFang SC",sans-serif}main{width:1440px;height:810px;overflow:hidden;padding:34px 70px;position:relative;background:radial-gradient(ellipse at 80% 12%,#24302155,transparent 55%),#0b0c0c}header{display:flex;gap:12px;align-items:center;height:42px;font-size:24px;font-weight:700}header img{width:42px;height:42px;border-radius:50%}.tag{margin-left:auto;font-size:15px;font-weight:400;color:#a5ada7;letter-spacing:1px}.eyebrow{font-size:17px;color:#efaa4a;letter-spacing:1.4px;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:66px;align-items:center;height:444px;margin-top:35px}h1{font-size:54px;line-height:1.17;letter-spacing:-1.6px;margin:20px 0 24px;max-width:710px}h2{font-size:37px;letter-spacing:-.8px;line-height:1.23;margin:12px 0}p{font-size:24px;line-height:1.6;margin:0;color:#bac2bc}.steps{display:flex;gap:18px;align-items:center;margin-top:30px;color:#c8d0ca;font-size:19px}.steps b{color:#eea740;font-weight:400}.card{border:1px solid #363d37;border-radius:24px;padding:30px;background:linear-gradient(125deg,#1b211c,#131614);box-shadow:0 24px 70px #0005}.meta{font-size:17px;color:#9da79f}.ticker{font-size:56px;letter-spacing:-2px;color:#f4f5f2;font-weight:700}.badges{display:flex;gap:10px;margin:18px 0}.badge{border:1px solid #475143;border-radius:6px;font-size:15px;padding:7px 10px;color:#c2d1c5}.badge.gold{border-color:#765425;color:#f2b14e;background:#292011}.mini-quote{font-size:28px;line-height:1.45;margin:18px 0}.source-link{font-size:19px;color:#e5a749;margin-top:22px;display:block}.source-heading{margin-top:30px}.source-grid{display:grid;grid-template-columns:1.08fr 1fr;gap:36px;margin-top:24px}.source-grid .card{height:282px}.timestamp{font-size:21px;color:#f5b050;display:inline-flex;border:1px solid #6c4c26;border-radius:7px;padding:8px 14px;margin-bottom:14px}.quote{font-size:33px;line-height:1.55}.source-grid p{font-size:21px}.rule{margin-top:18px;font-size:17px;color:#a9b2ac}.chart-head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:30px}.chart-head h1{font-size:40px;margin:8px 0}.stats{display:flex;gap:38px}.stats div{display:flex;flex-direction:column;gap:5px}.stats span{font-size:15px;color:#aab5ad}.stats strong{font-size:38px;color:#a4d092;letter-spacing:-1px}.stats .benchmark{color:#9dbce2}.chart-box{border:1px solid #343b34;border-radius:18px;background:#101411;padding:14px 26px 12px;margin-top:18px;height:310px}.chart-box svg{width:100%;height:264px;display:block}.chart-key{display:flex;gap:26px;font-size:16px;color:#bbc4bd}.chart-key span:first-child{color:#a4d092}.chart-key span:last-child{color:#9dbce2}.follow-grid{display:grid;grid-template-columns:1.2fr .82fr;gap:30px;margin-top:20px}.follow-grid .card{height:295px}.follow-grid .card p{font-size:24px}.feature{display:flex;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid #323931;font-size:26px}.feature:last-child{border-bottom:0}.feature span{color:#eeb05c;font-size:18px}.follow-title{font-size:31px;margin:8px 0 25px}.end{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;height:466px;margin-top:12px}.end img{width:96px;height:96px;border-radius:50%;margin-bottom:10px}.end h1{font-size:56px;max-width:1200px;margin:18px 0}.cta{display:inline-block;background:#ff9a13;color:#16120a;border-radius:12px;padding:18px 30px;font-weight:700;font-size:26px;margin-top:18px}.url{font-size:23px;color:#b8c5bc;margin-top:22px}.footer{position:absolute;left:70px;right:70px;bottom:24px;border-top:1px solid #333a34;padding-top:16px;display:flex;justify-content:space-between;gap:26px;font-size:15px;color:#9ca69f;line-height:1.5}.footer span:first-child{max-width:1080px}.chapter-progress{position:absolute;bottom:89px;left:70px;display:flex;gap:10px}.chapter-progress i{width:56px;height:3px;background:#333a33}.chapter-progress i.on{background:#e9a443}.reserve{position:absolute;top:566px;left:70px;right:70px;height:140px;pointer-events:none}.excerpt{color:#c6cfca;font-size:19px;margin-top:18px}
.app-shot{height:333px;overflow:hidden;border:1px solid #363d37;border-radius:14px;background:#080a09;text-align:center}.app-shot img{height:100%;width:100%;object-fit:cover;object-position:center top}.follow-grid .card{height:333px}.follow-grid .feature{padding:24px 0}
</style></head><body><main><header><img src="/avatar-160.jpg" alt="Ducky"><span>Ducky</span><span class="tag" id="tag"></span></header><div id="content"></div><div class="reserve" aria-hidden="true"></div><div class="chapter-progress" id="progress"></div><footer class="footer"><span id="foot"></span><span>duckybot.app</span></footer></main>
<script type="module">
const q=new URLSearchParams(location.search),en=q.get('lang')==='en',scene=q.get('scene')||'01-idea',step=Math.max(0,Math.min(20,Number(q.get('step')??20)));
const data=await(await fetch('/story-case.json')).json(),root=document.getElementById('content');
document.documentElement.lang=en?'en':'zh';
document.getElementById('tag').textContent=en?'PRODUCT TOUR · HISTORICAL EXAMPLE':'产品演示 · 历史案例';
const stages=['01-idea','02-source','03-outcome','04-follow','05-start'];
document.getElementById('progress').innerHTML=stages.map((x,i)=>`<i class="${i<=stages.indexOf(scene)?'on':''}"></i>`).join('');
const foot=en?'Selected historical example · price changes, not creator returns · full source and dates available':'精选历史案例 · 展示股价变化，不代表博主收益 · 原文与日期可核对';
document.getElementById('foot').textContent=foot;
const sourceMeta=en?'Shanghao Jin · Published May 5, 2026, 01:39 UTC':'商浩金 Shanghao Jin · 发布于 2026-05-05 01:39 UTC';
const summary=en?'Holding AMD. No immediate change planned.':'持有 AMD，暂不调整。';
const drawChart=(n,compact=false)=>{
 const width=1200,height=255,left=56,right=1120,top=20,bottom=214;
 const x=i=>left+(right-left)*i/20,y=v=>bottom-(bottom-top)*v/60;
 const series=col=>data.path.slice(0,n+1).map((p,i)=>`${i?'L':'M'}${x(i).toFixed(2)},${y(p[col]).toFixed(2)}`).join(' ');
 const grids=[0,20,40,60].map(v=>`<line x1="${left}" y1="${y(v)}" x2="${right}" y2="${y(v)}" stroke="#343e36" stroke-dasharray="3 7"/><text x="42" y="${y(v)+6}" fill="#a8b4ad" text-anchor="end" font-size="17">${v}%</text>`).join('');
 const dates=[0,5,10,15,20].map(i=>`<text x="${x(i)}" y="247" fill="#a8b4ad" text-anchor="middle" font-size="17">${data.path[i].d.slice(5)}</text>`).join('');
 const at=data.path[n];
 return `<svg role="img" aria-label="AMD and SPY, 21 actual daily observations, May 5 to June 3 2026" viewBox="0 0 ${width} ${height}">${grids}<path d="${series('stock')}" fill="none" stroke="#a4d092" stroke-width="5" stroke-linejoin="round"/><path d="${series('spy')}" fill="none" stroke="#92b5e1" stroke-width="3" stroke-dasharray="9 7"/><circle cx="${x(n)}" cy="${y(at.stock)}" r="6" fill="#d1f3c0"/>${dates}</svg>`;
};
if(scene==='01-idea'){
 root.innerHTML=`<div class="hero"><div><div class="eyebrow">${en?'FROM A VIEW TO A PRICE PATH':'从博主观点，到后续股价'}</div><h1>${en?'A stock idea.<br>What happened next?':'博主的股票观点，<br>后来表现怎么样？'}</h1><p>${en?'Check the original words.<br>Then see the days that followed.':'先核对原话，<br>再看后来的每一天。'}</p><div class="steps"><span>${en?'Creator view':'博主观点'}</span><b>→</b><span>${en?'Price history':'后续股价'}</span><b>→</b><span>${en?'Your alerts':'你的提醒'}</span></div></div><div class="card"><div class="meta">${en?'A real example from creator research':'一条真实的博主研究记录'}</div><div class="ticker" style="margin-top:18px">AMD</div><div class="badges"><span class="badge">${en?'Reported holding':'作者自述持有'}</span><span class="badge gold">${en?'Historical review':'历史回看'}</span></div><div class="mini-quote">${summary}</div><div class="meta">${en?'Shanghao Jin · May 5, 2026':'商浩金 · 2026-05-05'}</div><span class="source-link">${en?'Original video · 22:49 ↗':'原视频 · 22:49 ↗'}</span></div></div>`;
}else if(scene==='02-source'){
 root.innerHTML=`<div class="source-heading"><div class="eyebrow">${en?'01 / CHECK THE SOURCE':'01 / 先核对原话'}</div><h1 style="font-size:44px;margin:12px 0">${en?'Read the point. Hear it in context.':'看完观点，点开时间，听原话。'}</h1></div><div class="source-grid"><div class="card"><div class="meta">${sourceMeta}</div><div class="badges"><span class="badge">AMD</span><span class="badge">${en?'View summary':'观点摘要'}</span></div><div class="quote">${summary}</div><p style="margin-top:12px">${en?'See the context behind the view.':'完整上下文，随时可查。'}</p></div><div class="card"><span class="timestamp">▶ 22:49</span><div class="quote">${en?'Open the exact<br>moment in the video.':'直接跳到<br>谈这只股票的那一刻。'}</div><div class="source-link">${en?'Open original video ↗':'打开原视频 ↗'}</div><div class="rule">${en?'Source context and publication time remain available.':'保留原始上下文和发布时间。'}</div></div></div>`;
}else if(scene==='03-outcome'){
 root.innerHTML=`<div class="chart-head"><div><div class="eyebrow">${en?'02 / SEE WHAT FOLLOWED':'02 / 再看后来的涨跌'}</div><h1>AMD · ${en?'20 trading days later':'20 个交易日之后'}</h1><div class="meta">2026-05-05 → 2026-06-03 · ${en?'Historical price review':'历史股价回看'}</div></div><div class="stats"><div><span>AMD</span><strong>${step===20?'+52.7%':'—'}</strong></div><div><span>SPY</span><strong class="benchmark">${step===20?'+4.2%':'—'}</strong></div></div></div><div class="chart-box">${drawChart(step)}<div class="chart-key"><span>━ AMD</span><span>┄ SPY</span></div></div>`;
 document.getElementById('foot').textContent=en?'Historical prices · excludes dividends and trading costs · not a live alert or creator return':'历史股价变化，不含分红与交易费用 · 非当时推送，非博主收益';
}else if(scene==='04-follow'){
 root.innerHTML=`<div class="source-heading"><div class="eyebrow">${en?'03 / KEEP FOLLOWING':'03 / 继续跟进你的股票'}</div><h1 style="font-size:46px;margin:12px 0">${en?'Make it part of your own watchlist.':'加进自选，继续跟进。'}</h1></div><div class="follow-grid"><div class="app-shot"><img src="/chart-${en?'en':'zh'}.png" alt="${en?'Ducky AMD stock page captured September 6, 2026':'Ducky AMD 股票页面，2026-09-06 实际画面'}"></div><div class="card"><div class="feature"><span>01</span>${en?'Add to your watchlist':'加入自选'}</div><div class="feature"><span>02</span>${en?'Check company events':'查看公司消息'}</div><div class="feature"><span>03</span>${en?'Set your own alerts':'设置你的提醒'}</div></div></div>`;
 document.getElementById('foot').textContent=en?'Example workflow · alerts require your confirmation · Free includes 3 condition alerts; creator research requires Pro':'操作流程示例 · 提醒需自行确认开启 · 免费含 3 条条件提醒，博主研究需 Pro';
}else{
 root.innerHTML=`<div class="end"><img src="/avatar-160.jpg" alt="Ducky"><h1>${en?'Start with a stock you follow.':'从你关心的一只股票开始。'}</h1><div class="cta">${en?'Start free →':'免费开始 →'}</div><div class="url">duckybot.app</div></div>`;
 document.getElementById('foot').textContent=en?'Watchlist, calendar and 3 condition alerts are free · creator research requires Pro':'自选、日历和 3 条条件提醒免费 · 博主研究需 Pro';
}
</script></body></html>
