<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ducky · Corning alert story</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0e0c;color:#f3f4ef;font-family:Arial,"PingFang SC",sans-serif}main{width:1440px;height:810px;padding:30px 64px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 90% 12%,#243f2b77,transparent 65%),#0b0e0c}header{height:44px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:25px}header img{width:44px;height:44px;border-radius:50%}.tag{margin-left:auto;font-size:16px;font-weight:400;letter-spacing:1px;color:#b0baaf}.label{font-size:19px;color:#edac57;letter-spacing:1px}.layout{display:grid;grid-template-columns:1fr 1.04fr;gap:46px;align-items:center;margin-top:42px;height:432px}h1{font-size:60px;letter-spacing:-1.5px;line-height:1.15;margin:16px 0 22px}h2{font-size:34px;margin:14px 0}p{font-size:26px;line-height:1.5;color:#bec9bf;margin:10px 0}.card{border:1px solid #3c493e;border-radius:25px;padding:30px;background:linear-gradient(130deg,#233126,#141b16);box-shadow:0 20px 60px #0005}.meta{font-size:19px;color:#b3c1b4;line-height:1.5}.big{font-size:78px;font-weight:700;letter-spacing:-2px;line-height:1.1}.green{color:#ade093}.orange{color:#f5b158}.badge{display:inline-flex;align-items:center;gap:12px;font-size:23px;border:1px solid #527344;background:#2b4328;border-radius:11px;padding:13px 18px;color:#c4f2ac;margin-top:22px}.badge.pending{background:#312b1c;border-color:#756034;color:#f0ca8c}.rule{border:1px solid #435442;border-radius:13px;padding:18px 20px;margin-top:22px;font-size:25px;color:#e1e9dd}.company{font-size:42px;font-weight:700}.cross{color:#f4af55;font-size:36px;margin:20px 0}.date{font-size:21px;color:#b3bdb4}.chart-head{display:flex;justify-content:space-between;align-items:end;margin-top:32px}.chart-head h1{font-size:44px;margin:11px 0 6px}.stats{display:flex;gap:38px}.stats span{display:block;font-size:18px;color:#b8c6bb;margin-bottom:7px}.stats strong{font-size:56px;color:#ade093}.stats .spy{font-size:38px;color:#a0bdea}.chart-card{margin-top:20px;padding:15px 25px 10px;height:310px;background:#101a13;border:1px solid #3a4b3d;border-radius:20px}.chart-card svg{width:100%;height:262px}.key{display:flex;gap:28px;font-size:18px;color:#bbd5b4}.gauge{position:relative;margin:30px 0 21px;height:12px;background:linear-gradient(to right,#a9d58a 0 35%,#435149 35%);border-radius:10px}.gauge:after{content:'';position:absolute;left:35%;top:-9px;height:30px;width:3px;background:#edaa53}.gauge i{position:absolute;width:23px;height:23px;top:-6px;border:4px solid #0e1912;border-radius:50%;background:#fff}.gauge-labels{display:flex;justify-content:space-between;color:#abb8ac;font-size:19px}.app{width:100%;height:380px;object-fit:contain;border:1px solid #3d483e;border-radius:20px;background:#101311}.end{height:446px;margin-top:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.end img{width:90px;height:90px;border-radius:50%;margin-bottom:4px}.end h1{font-size:57px;max-width:1200px;margin:16px 0}.cta{display:inline-block;color:#161209;background:#ffab36;border-radius:13px;padding:20px 35px;font-size:29px;font-weight:700}.footer{position:absolute;bottom:25px;left:64px;right:64px;border-top:1px solid #364438;padding-top:15px;display:flex;justify-content:space-between;gap:30px;font-size:17px;color:#a7b5a9}.progress{position:absolute;left:64px;bottom:94px;display:flex;gap:10px}.progress i{width:62px;height:4px;background:#334036}.progress i.on{background:#f0ae54}.reserve{position:absolute;top:558px;height:150px;left:64px;right:64px}.price-chart{margin-top:17px}.price-chart svg{width:100%;height:190px}.state{font-size:17px;color:#d2b386;margin:13px 0 0}.small{font-size:19px}.split{display:flex;align-items:end;justify-content:space-between;gap:20px}.pulse{box-shadow:0 0 0 5px #a9d68b16,0 20px 60px #0005}
</style></head><body><main><header><img src="/avatar-160.jpg" alt="Ducky"><span>Ducky</span><span class="tag" id="tag"></span></header><div id="content"></div><div class="reserve" aria-hidden="true"></div><div class="progress" id="progress"></div><footer class="footer"><span id="foot"></span><span>duckybot.app</span></footer></main><script type="module">
const q=new URLSearchParams(location.search),en=q.get('lang')==='en',scene=q.get('scene')||'01-event',step=Math.max(0,Math.min(20,Number(q.get('step')??20)));
const d=await(await fetch('/case.json')).json(),root=document.getElementById('content'),tr=(zh,enText)=>en?enText:zh;
document.documentElement.lang=en?'en':'zh';
document.getElementById('tag').textContent=tr('康宁 GLW · 历史条件回放','CORNING · HISTORICAL CONDITION REPLAY');
const scenes=['01-event','02-price','03-check','04-trigger','05-outcome','06-start'];
document.getElementById('progress').innerHTML=scenes.map((s,i)=>`<i class="${i<=scenes.indexOf(scene)?'on':''}"></i>`).join('');
const foot=document.getElementById('foot');foot.textContent=tr('按历史日线重建条件，非当时推送记录','Conditions replayed from daily history · not a record of alerts sent');
const gauge=(value)=>`<div class="gauge"><i style="left:calc(${value}% - 11px)"></i></div><div class="gauge-labels"><span>0</span><span>35 ${tr('· 自定阈值','· Your threshold')}</span><span>100</span></div>`;
const bell=`<svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0v6l2 3H4l2-3Zm4 12h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
function priceChart(n){const a=d.price_alert.path,x=i=>32+i*61,y=v=>174-(v-170)*3.5;return `<svg viewBox="0 0 560 210" role="img" aria-label="GLW daily closes May 6 to May 18"><line x1="25" x2="535" y1="${y(180)}" y2="${y(180)}" stroke="#edac57" stroke-dasharray="7 6"/><text x="535" y="${y(180)-12}" text-anchor="end" fill="#edac57" font-size="18">$180</text><path d="${a.slice(0,n+1).map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.close)}`).join(' ')}" fill="none" stroke="#b5dd9e" stroke-width="5" stroke-linejoin="round"/><circle cx="${x(n)}" cy="${y(a[n].close)}" r="6" fill="#f4f4ed"/><text x="32" y="205" fill="#bac6bb" font-size="17">05-06</text><text x="520" y="205" text-anchor="end" fill="#bac6bb" font-size="17">05-18</text></svg>`}
function outcomeChart(n){const a=d.outcome.path,x=i=>62+i*57,y=v=>218-(v+5)*4.3,series=k=>a.slice(0,n+1).map((p,i)=>`${i?'L':'M'}${x(i)},${y(p[k])}`).join(' ');return `<svg viewBox="0 0 1260 264" role="img" aria-label="GLW and SPY, every daily close July 28 to August 25 2026">${[0,20,40].map(v=>`<line x1="62" x2="1202" y1="${y(v)}" y2="${y(v)}" stroke="#3a4a3d" stroke-dasharray="4 8"/><text x="48" y="${y(v)+6}" text-anchor="end" fill="#b0beb2" font-size="19">${v}%</text>`).join('')}<path d="${series('stock')}" fill="none" stroke="#ade093" stroke-width="5" stroke-linejoin="round"/><path d="${series('spy')}" fill="none" stroke="#9ebde9" stroke-width="3" stroke-dasharray="9 7"/><circle cx="${x(n)}" cy="${y(a[n].stock)}" r="6" fill="#ecffdf"/>${[0,5,10,15,20].map(i=>`<text x="${x(i)}" y="259" text-anchor="middle" fill="#b0beb2" font-size="19">${a[i].d.slice(5)}</text>`).join('')}</svg>`}
if(scene==='01-event'){
root.innerHTML=`<div class="layout"><div><div class="label">2026-05-06 · ${tr('公司公告','COMPANY ANNOUNCEMENT')}</div><h1>${tr('英伟达 × 康宁<br>接下来，盯什么？','NVIDIA × Corning.<br>What comes next?')}</h1><p>${tr('有了消息，<br>把关注变成你的提醒条件。','A company makes news.<br>Decide what you want to watch.')}</p></div><div class="card"><div class="company">NVIDIA <span class="orange">×</span> Corning</div><div class="meta" style="margin-top:14px">GLW · ${tr('长期合作','Long-term partnership')}</div><div class="big orange" style="margin-top:30px">$500M</div><p>${tr('英伟达购买认股权证','NVIDIA warrant purchase')}</p><div class="meta">${tr('来源：康宁 SEC 8-K · 2026-05-06','Source: Corning SEC 8-K · May 6, 2026')}</div></div></div>`;
}else if(scene==='02-price'){
const n=Math.min(8,step);root.innerHTML=`<div class="layout"><div><div class="label">01 / ${tr('到你设的价格','YOUR PRICE LEVEL')}</div><h1>${tr('到价了，<br>提醒你。','Your level.<br>Your alert.')}</h1><div class="rule">GLW ≤ <b class="orange">$180</b></div><p class="small">${tr('自定价格示例 · 并非英伟达买入成本','Your example threshold · not NVIDIA’s cost basis')}</p></div><div class="card ${n===8?'pulse':''}"><div class="split"><div><div class="date">${d.price_alert.path[n].d}</div><h2>GLW <span class="green">$${d.price_alert.path[n].close.toFixed(2)}</span></h2></div><div class="meta">${tr('收盘价','Daily close')}</div></div><div class="price-chart">${priceChart(n)}</div>${n===8?`<div class="badge">${bell}${tr('价格条件满足','Price condition met')}</div>`:`<div class="state">${tr('继续跟踪价格','Tracking the price')}</div>`}</div></div>`;
}else if(scene==='03-check'||scene==='04-trigger'){
const met=scene==='04-trigger',value=met?d.rsi_alert.rsi_d:d.price_alert.technical_snapshot.rsi_d;
root.innerHTML=`<div class="layout"><div><div class="label">${met?'03':'02'} / ${tr(met?'指标也满足了':'再看超跌条件',met?'THE INDICATOR QUALIFIES':'CHECK THE INDICATOR')}</div><h1>${tr(met?'低于 35。<br>条件满足。':'跌了，<br>就算超跌？',met?'Below 35.<br>Condition met.':'A dip.<br>But oversold?')}</h1><p>${tr(met?'这次，日线 RSI 达到你设的条件。':'日线 RSI 51.6，尚未低于 35。',met?'Daily RSI meets your chosen condition.':'Daily RSI is 51.6. Still above 35.')}</p></div><div class="card ${met?'pulse':''}"><div class="split"><div class="date">${met?'2026-07-28':'2026-05-18'}</div><div class="meta">GLW · $${met?'126.01':'178.55'}</div></div><div class="meta" style="margin-top:25px">${tr('日线 RSI · 14 日','DAILY RSI · 14 PERIODS')}</div><div class="big ${met?'green':'orange'}" style="margin-top:10px">${value}</div>${gauge(value)}<div class="badge ${met?'':'pending'}">${met?bell:''}${tr(met?'RSI < 35 · 条件满足':'RSI < 35 · 尚未满足',met?'RSI < 35 · Condition met':'RSI < 35 · Not met')}</div></div></div>`;
}else if(scene==='05-outcome'){
const at=d.outcome.path[step];root.innerHTML=`<div class="chart-head"><div><div class="label">04 / ${tr('RSI 条件满足之后','AFTER THE RSI CONDITION')}</div><h1>${tr('20 个交易日，后来怎么样？','Twenty trading days. What followed?')}</h1><div class="date">2026-07-28 → 2026-08-25</div></div><div class="stats"><div><span>GLW</span><strong>${at.stock>=0?'+':''}${at.stock.toFixed(1)}%</strong></div><div><span>SPY</span><strong class="spy">${at.spy>=0?'+':''}${at.spy.toFixed(1)}%</strong></div></div></div><div class="chart-card">${outcomeChart(step)}<div class="key"><span>━ GLW · $126.01 → $${at.close.toFixed(2)}</span><span>┄ SPY</span><span style="margin-left:auto">${step===20?tr('完整期间，保留回落','Full period. Pullbacks included.'):at.d}</span></div></div>`;
foot.textContent=tr('精选历史案例 · 股价变化，不含分红与费用 · 历史表现不代表未来收益','Selected history · price changes exclude dividends and costs · past results do not predict future returns');
}else if(step<10){
root.innerHTML=`<div class="layout" style="grid-template-columns:.8fr 1.2fr;gap:36px"><div><div class="label">05 / ${tr('设好你的提醒','SET YOUR ALERT')}</div><h1 style="font-size:56px">${tr('条件你定。<br>Ducky 帮你盯。','Your rules.<br>Ducky keeps watch.')}</h1><div class="rule">${tr('到价提醒 · RSI 条件','Price levels · RSI conditions')}</div></div><img class="app" src="/alerts-${en?'en':'zh'}.png" alt="${tr('Ducky 提醒页面实际画面，未保存示例','Actual Ducky alert form, unsaved example')}"></div>`;
foot.textContent=tr('免费含 3 条条件提醒 · 核对后自行开启','Free includes 3 condition alerts · review and enable your own');
}else{
root.innerHTML=`<div class="end"><img src="/avatar-160.jpg" alt="Ducky"><h1>${tr('设好条件，Ducky 帮你盯。','Set your rules. Ducky keeps watch.')}</h1><div class="cta">${tr('免费试试 →','Try it free →')}</div><p>duckybot.app</p></div>`;foot.textContent=tr('免费含 3 条条件提醒 · 核对后自行开启','Free includes 3 condition alerts · review and enable your own');
}
await document.fonts.ready;
await Promise.all([...document.images].map(img=>img.decode().catch(()=>{})));
document.body.dataset.ready='true';
</script></body></html>
